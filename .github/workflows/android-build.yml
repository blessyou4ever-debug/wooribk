name: Android Release APK Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Signing Keystore (Play 프로텍트 차단 방지용 전용 서명)
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v \
            -keystore app/keystore/release.jks \
            -alias gyeongjobi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "gyeongjobi2026" \
            -keypass "gyeongjobi2026" \
            -dname "CN=GyeongjobiApp, OU=PersonalUtility, O=PersonalLedger, L=Seoul, ST=Seoul, C=KR"

      - name: Run Unit Tests
        run: gradle testReleaseUnitTest --stacktrace

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gyeongjobi-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release (태그 푸시 시)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
