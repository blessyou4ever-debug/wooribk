name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Keystore & Environment
        run: |
          mkdir -p app/keystore
          if [ ! -f app/keystore/release.jks ]; then
            keytool -genkeypair -v \
              -keystore app/keystore/release.jks \
              -alias gyeongjobi \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "gyeongjobi2026" \
              -keypass "gyeongjobi2026" \
              -dname "CN=GyeongjobiApp, OU=PersonalUtility, O=PersonalLedger, L=Seoul, ST=Seoul, C=KR"
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gyeongjobi-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
